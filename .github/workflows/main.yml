name: Build Sekna APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get files
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o "$(find . -maxdepth 1 -name '*.zip' | head -n 1)"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p sekna_android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sekna-APK
          path: sekna_android/app/build/outputs/apk/debug/app-debug.apk
